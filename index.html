
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#145c46">

  <title>Qasr Namaz - কসর নামাজ দূরত্ব নির্ধারণ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f4f7f5;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    header {
      background: #145c46;
      color: white;
      text-align: center;
      padding: 25px 12px;
      border-radius: 14px;
      margin-bottom: 18px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }

    h2 {
      color: #145c46;
      font-size: 20px;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #145c46;
      color: white;
      font-size: 16px;
      margin-top: 12px;
      cursor: pointer;
    }

    button.secondary {
      background: #277d9a;
    }

    button.delete {
      background: #b83232;
    }

    .distance-item {
      background: #f0f7f3;
      border-left: 4px solid #145c46;
      padding: 14px;
      border-radius: 8px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .danger {
      color: red;
      font-weight: bold;
    }

    .note {
      font-size: 13px;
      color: #666;
      line-height: 1.7;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>🕌 কসর নামাজ</h1>
    <p>৪৭ মাইল দূরত্ব নির্ধারণ ব্যবস্থা</p>
  </header>

  <!-- Permanent Address -->
  <section class="card">

    <h2>🏠 স্থায়ী ঠিকানা</h2>

    <label>স্থায়ী ঠিকানার নাম</label>
    <input id="homeAddress"
      placeholder="স্থায়ী ঠিকানা লিখুন">

    <label>Latitude</label>
    <input id="homeLat"
      type="number" step="any"
      placeholder="Latitude">

    <label>Longitude</label>
    <input id="homeLng"
      type="number" step="any"
      placeholder="Longitude">

    <button onclick="getGPS('home')">
      GPS দিয়ে স্থায়ী অবস্থান নিন
    </button>

    <button onclick="saveAddress('home')">
      স্থায়ী ঠিকানা সংরক্ষণ
    </button>

  </section>

  <!-- Current Address -->
  <section class="card">

    <h2>📍 বর্তমান ঠিকানা</h2>

    <label>বর্তমান ঠিকানার নাম</label>
    <input id="currentAddress"
      placeholder="বর্তমান ঠিকানা লিখুন">

    <label>Latitude</label>
    <input id="currentLat"
      type="number" step="any"
      placeholder="Latitude">

    <label>Longitude</label>
    <input id="currentLng"
      type="number" step="any"
      placeholder="Longitude">

    <button onclick="getGPS('current')">
      GPS দিয়ে বর্তমান অবস্থান নিন
    </button>

    <button onclick="saveAddress('current')">
      বর্তমান ঠিকানা সংরক্ষণ
    </button>

  </section>

  <!-- Destination -->
  <section class="card">

    <h2>🧭 সফরের গন্তব্য</h2>

    <label>গন্তব্যের নাম</label>
    <input id="destinationAddress"
      placeholder="গন্তব্যের ঠিকানা লিখুন">

    <label>Latitude</label>
    <input id="destinationLat"
      type="number" step="any"
      placeholder="Latitude">

    <label>Longitude</label>
    <input id="destinationLng"
      type="number" step="any"
      placeholder="Longitude">

    <button onclick="getGPS('destination')">
      GPS দিয়ে গন্তব্য নির্ধারণ
    </button>

    <button onclick="saveAddress('destination')">
      গন্তব্য সংরক্ষণ
    </button>

  </section>

  <!-- Distance -->
  <section class="card">

    <h2>📏 ৪৭ মাইল দূরত্ব পরীক্ষা</h2>

    <p>
      নির্ধারিত দূরত্ব:
      <b>৪৭ মাইল = ৭৫.৬৩৯ কিলোমিটার</b>
    </p>

    <button onclick="calculateAll()">
      দূরত্ব হিসাব করুন
    </button>

    <div id="distanceResult">
      <p>দূরত্বের ফলাফল এখানে দেখানো হবে।</p>
    </div>

  </section>

  <!-- Saved Address -->
  <section class="card">

    <h2>💾 সংরক্ষিত ঠিকানা</h2>

    <div id="savedList"></div>

    <button class="delete"
      onclick="clearAll()">
      সব ঠিকানা মুছে ফেলুন
    </button>

  </section>

  <footer>
    Qasr Namaz Distance Calculator
    <br>
    Local Storage Enabled
  </footer>

</div>

<script>

  const LIMIT = 47;

  // Load saved data
  function getSaved() {
    return JSON.parse(
      localStorage.getItem("qasrAddresses") || "{}"
    );
  }

  // Save data
  function saveAll(data) {
    localStorage.setItem(
      "qasrAddresses",
      JSON.stringify(data)
    );
  }

  // Save address
  function saveAddress(type) {

    const prefix = {
      home: "home",
      current: "current",
      destination: "destination"
    }[type];

    const address = document.getElementById(
      prefix + "Address"
    ).value.trim();

    const lat = parseFloat(
      document.getElementById(prefix + "Lat").value
    );

    const lng = parseFloat(
      document.getElementById(prefix + "Lng").value
    );

    if (!address || !Number.isFinite(lat) ||
        !Number.isFinite(lng) ||
        Math.abs(lat) > 90 ||
        Math.abs(lng) > 180) {
      alert("সঠিক ঠিকানা ও GPS স্থানাঙ্ক দিন।");
      return;
    }

    const data = getSaved();

    data[type] = {
      address: address,
      lat: lat,
      lng: lng
    };

    saveAll(data);

    showSaved();

    alert("ঠিকানা সফলভাবে সংরক্ষণ হয়েছে।");
  }

  // Get GPS location
  function getGPS(type) {

    if (!navigator.geolocation) {
      alert("আপনার ব্রাউজারে GPS সুবিধা নেই।");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function(position) {

        const prefix = type;

        document.getElementById(
          prefix + "Lat"
        ).value = position.coords.latitude;

        document.getElementById(
          prefix + "Lng"
        ).value = position.coords.longitude;

        alert("GPS অবস্থান পাওয়া গেছে।");

      },

      function(error) {
        alert("GPS পাওয়া যায়নি। Location Permission দিন।");
      },

      {
        enableHighAccuracy: true,
        timeout: 15000
      }
    );
  }

  // Distance calculation
  function calculateDistance(lat1, lon1, lat2, lon2) {

    const R = 3958.7613;

    const rad = x => x * Math.PI / 180;

    const dLat = rad(lat2 - lat1);
    const dLon = rad(lon2 - lon1);

    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(rad(lat1)) *
      Math.cos(rad(lat2)) *
      Math.sin(dLon / 2) ** 2;

    const c = 2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

    return R * c;
  }

  // Show results
  function calculateAll() {

    const data = getSaved();

    const home = data.home;
    const current = data.current;
    const destination = data.destination;

    const result = document.getElementById(
      "distanceResult"
    );

    if (!destination) {
      result.innerHTML =
        "<p class='danger'>প্রথমে গন্তব্য সংরক্ষণ করুন।</p>";
      return;
    }

    function showDistance(place, name) {

      if (!place) {
        return `
          <div class="distance-item">
            <h3>${name}</h3>
            <p>ঠিকানা সংরক্ষণ করা হয়নি।</p>
          </div>
        `;
      }

      const miles = calculateDistance(
        place.lat,
        place.lng,
        destination.lat,
        destination.lng
      );

      const km = miles * 1.609344;

      const eligible = miles >= LIMIT;

      return `
        <div class="distance-item">

          <h3>${name}</h3>

          <p>
            ঠিকানা: ${escapeHTML(place.address)}
          </p>

          <p>
            গন্তব্য: ${escapeHTML(destination.address)}
          </p>

          <p>
            দূরত্ব:
            <b>${miles.toFixed(2)} মাইল</b>
          </p>

          <p>
            কিলোমিটার:
            <b>${km.toFixed(2)} কিমি</b>
          </p>

          <p class="${eligible ? 'success' : 'danger'}">
            ${eligible
              ? "৪৭ মাইলের সীমা পূরণ হয়েছে"
              : "৪৭ মাইলের সীমা পূরণ হয়নি"}
          </p>

        </div>
      `;
    }

    result.innerHTML =
      showDistance(home, "🏠 স্থায়ী ঠিকানা থেকে") +
      showDistance(current, "📍 বর্তমান ঠিকানা থেকে");

  }

  // Prevent HTML injection in saved address
  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function(char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char];
    });
  }

  // Show saved addresses
  function showSaved() {

    const data = getSaved();

    const names = {
      home: "স্থায়ী ঠিকানা",
      current: "বর্তমান ঠিকানা",
      destination: "সফরের গন্তব্য"
    };

    let html = "";

    Object.keys(names).forEach(function(type) {

      const item = data[type];

      if (item) {
        html += `
          <div class="distance-item">
            <b>${names[type]}</b>
            <p>${escapeHTML(item.address)}</p>
            <small>
              ${item.lat}, ${item.lng}
            </small>
            <button class="delete"
              onclick="deleteAddress('${type}')">
              মুছে ফেলুন
            </button>
          </div>
        `;
      }

    });

    document.getElementById(
      "savedList"
    ).innerHTML = html || "কোনো ঠিকানা সংরক্ষিত নেই।";
  }

  // Delete individual address
  function deleteAddress(type) {

    const data = getSaved();

    delete data[type];

    saveAll(data);

    showSaved();

    document.getElementById("distanceResult").innerHTML =
      "ঠিকানা পরিবর্তন হয়েছে। আবার হিসাব করুন।";
  }

  // Clear all
  function clearAll() {

    if (confirm("সব ঠিকানা মুছে ফেলতে চান?")) {

      localStorage.removeItem("qasrAddresses");

      showSaved();

      document.getElementById(
        "distanceResult"
      ).innerHTML = "ঠিকানা মুছে ফেলা হয়েছে।";
    }
  }

  // Load data into form
  function loadForms() {

    const data = getSaved();

    ["home", "current", "destination"].forEach(
      function(type) {

        if (data[type]) {

          const item = data[type];

          document.getElementById(
            type + "Address"
          ).value = item.address;

          document.getElementById(
            type + "Lat"
          ).value = item.lat;

          document.getElementById(
            type + "Lng"
          ).value = item.lng;
        }
      }
    );

    showSaved();
  }

  loadForms();

</script>

</body>
  </html>
